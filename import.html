<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Passbook — Import data</title>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f3ee; color: #2a241c; margin: 0; padding: 24px 16px 60px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 6px; }
  p.lead { color: #6b6152; margin: 0 0 22px; line-height: 1.5; }
  .card { background: #fff; border: 1px solid #e4ddd0; border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
  input[type=email], input[type=password] { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #d8d0c0; border-radius: 6px; font-size: 0.95rem; margin-bottom: 12px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 220px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.72rem; line-height: 1.4; padding: 10px; border: 1px solid #d8d0c0; border-radius: 6px; }
  button { background: #2a241c; color: #fff; border: none; border-radius: 6px; padding: 10px 16px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: #fff; color: #2a241c; border: 1px solid #d8d0c0; }
  .status { margin-top: 14px; font-size: 0.85rem; white-space: pre-wrap; }
  .status.err { color: #a4291f; }
  .status.ok { color: #1f7a3d; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Passbook — Import data</h1>
  <p class="lead">
    One-time tool to bring your data across from the old Passbook into this Supabase-backed
    app. Paste the JSON you copied from the old app's <strong>Export data</strong> panel below.
    Safe to run more than once — matching records are updated in place rather than duplicated.
  </p>

  <div class="card" id="auth-card">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button type="button" id="signin-btn">Sign in</button>
    <div class="status" id="auth-status"></div>
  </div>

  <div class="card" id="import-card" hidden>
    <label for="json-input">Exported JSON</label>
    <textarea id="json-input" placeholder="Paste the exported JSON here…"></textarea>
    <div style="margin-top:12px;">
      <button type="button" id="import-btn">Import into Supabase</button>
      <button type="button" class="secondary" id="signout-btn">Sign out</button>
    </div>
    <div class="status" id="import-status"></div>
  </div>
</div>

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"
  integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp"
  crossorigin="anonymous"
></script>
<script src="config.js"></script>
<script src="import.js"></script>
</body>
</html>
