<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Passbook — Reset password</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
/>
<style>
  :root {
    --paper: #eef1ef;
    --paper-raised: #ffffff;
    --ink: #16202a;
    --ink-soft: #55636d;
    --ink-faint: #8b98a1;
    --line: #d7ddd8;
    --brass: #a8763a;
    --brass-deep: #8a6027;
    --positive: #2f7a63;
    --positive-tint: #e1efe9;
    --negative: #b14b36;
    --negative-tint: #f5e4df;
    --radius: 10px;
    --radius-sm: 7px;
    --shadow: 0 1px 2px rgba(22, 32, 42, 0.07), 0 6px 18px rgba(22, 32, 42, 0.06);
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Work Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #12181d;
      --paper-raised: #1b2329;
      --ink: #e9edee;
      --ink-soft: #a2afb5;
      --ink-faint: #6f7b81;
      --line: #2b353b;
      --brass: #d6a24f;
      --brass-deep: #f0be73;
      --positive: #4fae8f;
      --positive-tint: #17332a;
      --negative: #e17557;
      --negative-tint: #3a2019;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 6px 20px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-family: var(--font-display); font-weight: 600; margin: 0; font-size: 1.4rem; }
  button, input { font-family: inherit; font-size: inherit; color: inherit; }
  a { color: var(--brass-deep); }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 26px;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .tagline { margin: 2px 0 0; color: var(--ink-soft); font-size: 0.85rem; }
  .auth-error, .auth-notice {
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    font-size: 0.82rem;
  }
  .auth-error { background: var(--negative-tint); color: var(--negative); }
  .auth-notice { background: var(--positive-tint); color: var(--positive); }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.76rem; color: var(--ink-soft); }
  .field input {
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    min-height: 40px;
  }
  .field-hint { font-size: 0.74rem; color: var(--ink-faint); }
  .btn-primary {
    background: var(--brass);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px 18px;
    font-weight: 600;
    cursor: pointer;
    min-height: 42px;
  }
  .btn-primary:hover { background: var(--brass-deep); }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .back-link { text-align: center; font-size: 0.85rem; color: var(--ink-soft); }
</style>
</head>
<body>

<div class="auth-screen">
  <div class="auth-card">
    <div>
      <h1>Passbook</h1>
      <p class="tagline" id="status-tagline">Verifying your link…</p>
    </div>

    <div id="verify-error" class="auth-error" hidden>
      This link is invalid or has expired. Request a new one from the sign-in page.
    </div>

    <form id="reset-form" hidden>
      <div id="reset-error" class="auth-error" hidden></div>
      <div class="field">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" autocomplete="new-password" required minlength="6" />
        <span class="field-hint">At least 6 characters</span>
      </div>
      <div class="field" style="margin-top:10px;">
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" required minlength="6" />
      </div>
      <button type="submit" class="btn-primary" id="reset-submit" style="margin-top:14px;width:100%;">Set new password</button>
    </form>

    <div id="reset-success" hidden>
      <div class="auth-notice">Your password has been updated.</div>
      <p class="back-link" style="margin-top:12px;"><a href="index.html">Continue to sign in →</a></p>
    </div>

    <p class="back-link" id="back-link" hidden><a href="index.html">← Back to sign in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  "use strict";

  var sb = window.supabase.createClient(
    window.PASSBOOK_CONFIG.SUPABASE_URL,
    window.PASSBOOK_CONFIG.SUPABASE_ANON_KEY
  );

  var verified = false;

  function showForm() {
    if (verified) return;
    verified = true;
    document.getElementById("status-tagline").textContent = "Choose a new password";
    document.getElementById("verify-error").hidden = true;
    document.getElementById("back-link").hidden = true;
    document.getElementById("reset-form").hidden = false;
  }

  function showInvalid() {
    if (verified) return;
    document.getElementById("status-tagline").textContent = "Reset link";
    document.getElementById("verify-error").hidden = false;
    document.getElementById("back-link").hidden = false;
  }

  // Supabase surfaces an expired/used recovery link as error params on the
  // redirect URL rather than firing PASSWORD_RECOVERY.
  var params = new URLSearchParams(window.location.hash.replace(/^#/, "") || window.location.search);
  if (params.get("error")) {
    showInvalid();
  } else {
    sb.auth.onAuthStateChange(function (event) {
      if (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") showForm();
    });
    sb.auth.getSession().then(function (res) {
      if (res.data.session) showForm();
    });
    setTimeout(function () { if (!verified) showInvalid(); }, 4000);
  }

  document.getElementById("reset-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var errEl = document.getElementById("reset-error");
    var submitBtn = document.getElementById("reset-submit");
    errEl.hidden = true;

    var password = document.getElementById("new-password").value;
    var confirm = document.getElementById("confirm-password").value;

    if (password.length < 6) {
      errEl.textContent = "Password must be at least 6 characters.";
      errEl.hidden = false;
      return;
    }
    if (password !== confirm) {
      errEl.textContent = "Passwords don't match.";
      errEl.hidden = false;
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Saving…";
    sb.auth.updateUser({ password: password }).then(function (res) {
      if (res.error) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Set new password";
        errEl.textContent = res.error.message || "Could not update password.";
        errEl.hidden = false;
        return;
      }
      sb.auth.signOut().then(function () {
        document.getElementById("reset-form").hidden = true;
        document.getElementById("reset-success").hidden = false;
      });
    });
  });
})();
</script>
</body>
</html>
